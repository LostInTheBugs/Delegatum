server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── En-têtes de sécurité ────────────────────────────────────────
    # CSP testée sur les parcours réels (login, registre + export « Dossier
    # ITM » via pdf-lib, /verify, page de partage) : seul appel externe
    # autorisé = api.github.com (bandeau de mise à jour) ; polices et
    # images locales ou data:/blob:.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # SPA routing: all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'en-tête X-Forwarded-For est ÉCRASÉ par l'IP du pair direct :
        # toute valeur fournie par le client est ignorée (sinon l'attaquant
        # forge une IP neuve à chaque requête et contourne le rate-limit).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
