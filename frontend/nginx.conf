server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── En-têtes de sécurité (tier 1, sans risque) ──────────────────
    # La Content-Security-Policy reste à ajouter après un passage UI complet
    # (export PDF, partage /p/, upload du logo) — prévoir notamment
    # connect-src https://api.github.com pour le bandeau de mise à jour.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA routing: all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'en-tête X-Forwarded-For est ÉCRASÉ par l'IP du pair direct :
        # toute valeur fournie par le client est ignorée (sinon l'attaquant
        # forge une IP neuve à chaque requête et contourne le rate-limit).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
