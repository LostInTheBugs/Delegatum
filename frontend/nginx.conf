server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── En-têtes de sécurité ────────────────────────────────────────
    # CSP testée sur les parcours réels (login, registre + export « Dossier
    # ITM » via pdf-lib, /verify, page de partage) : seul appel externe
    # autorisé = api.github.com (bandeau de mise à jour) ; polices et
    # images locales ou data:/blob:.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # SPA routing: all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For est complété (append) au lieu d'être écrasé :
        # le pair direct (Traefik) y a déjà inséré l'IP du client ;
        # on ajoute l'IP de nginx à la fin. Le backend lit la dernière
        # valeur (droite) → IP réelle du client.
        proxy_set_header X-Forwarded-For "$remote_addr, $http_x_forwarded_for";
        # CF-Connecting-IP est SUPPRIMÉ : ce header n'est posé que par
        # Cloudflare edge. Un attaquant accédant à l'origine directement
        # ne peut pas le falsifier — il doit être absent pour que le
        # backend utilise X-Forwarded-For (complété par nginx).
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
